services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - order-sql-data:/var/opt/mssql
      - ./scrip order.sql:/scripts/schema.sql:ro
    restart: unless-stopped

volumes:
  order-sql-data:
