services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - order-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: order-db-init
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD in .env}
      MSSQL_HOST: sqlserver
    volumes:
      - ./scrip order.sql:/schema/schema.sql:ro
      - ./scripts/sql-init:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-schema.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Order.API/Dockerfile
    container_name: order-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Container
      ConnectionStrings__default: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      AuthSettings__Secret: ${AUTH_JWT_SECRET:?Configure AUTH_JWT_SECRET in .env}
      AuthSettings__Issuer: Order.Api
      HttpsRedirection__Enabled: "false"
    ports:
      - "5005:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Order/Dockerfile
    container_name: order-web
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Container
      OrderApi__BaseUrl: http://api:8080/
      HttpsRedirection__Enabled: "false"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  order-sql-data:
