name: CI

on:
  push:
    branches: [main, developer, "feature/**", "test/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main, developer]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Order.sln

      - name: Build
        shell: bash
        run: |
          if ! dotnet build Order.sln --no-restore -c Release -nologo > build.log 2>&1; then
            errs=$(grep -E "error [A-Za-z]+[0-9]+" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -40 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            if [ -z "$errs" ]; then
              errs=$(tail -25 build.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            fi
            echo "::error title=Build failed::${errs}"
            exit 1
          fi
          grep -E "warning [A-Za-z]+[0-9]+" build.log | sort -u | head -15 || true

      - name: Test
        run: dotnet test Order.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
