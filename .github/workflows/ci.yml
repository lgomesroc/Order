name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Order.sln
      - name: Build
        run: dotnet build Order.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test Order.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  sql-server-integration:
    name: SQL Server repository integration tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Order_Test_Password_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      ORDER_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Order_Test_Password_2026!;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Order.sln
      - name: Run SQL Server integration tests
        run: dotnet test Order.IntegrationTests/Order.IntegrationTests.csproj --configuration Release --filter "Category=Integration"
