name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Order.sln
      - name: Build
        run: dotnet build Order.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test Order.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  sql-server-integration:
    name: SQL Server repository integration tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Order_Test_Password_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      ORDER_TEST_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Order_Test_Password_2026!;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Order.sln
      - name: Run SQL Server integration tests
        run: dotnet test Order.IntegrationTests/Order.IntegrationTests.csproj --configuration Release --filter "Category=Integration"

  compose-smoke:
    name: Docker Compose full-stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local environment
        run: cp .env.example .env
      - name: Enable Swagger for the CI smoke test
        run: echo "Swagger__Enabled=true" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: Wait for API and Razor Pages
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:5005/swagger/index.html >/dev/null &&
               curl --fail --silent http://localhost:8080/ >/dev/null; then
              echo "API and Razor Pages are responding."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Authenticate demo user and create an order through the API
        run: bash scripts/e2e-smoke.sh
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color api db-init sqlserver
      - name: Stop containers
        if: always()
        run: docker compose down -v
